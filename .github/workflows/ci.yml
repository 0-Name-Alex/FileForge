name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FileForge.slnx

      - name: Build solution (Release)
        run: dotnet build FileForge.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test FileForge.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish portable bundle & Windows installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'v1.1.0' }
          $ver = $tag.TrimStart('v')
          dotnet publish src/FileForge.App/FileForge.App.csproj -c Release -r win-x64 --self-contained -o publish
          Copy-Item installer/install.ps1, installer/install.cmd, installer/uninstall.ps1 publish/ -Force
          $zipName = "FileForge-$tag-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zipName -Force

          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer/FileForge.iss

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FileForge-win-x64
          path: |
            FileForge-*-win-x64.zip
            dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FileForge-*-win-x64.zip
            dist/*.exe
          generate_release_notes: true
